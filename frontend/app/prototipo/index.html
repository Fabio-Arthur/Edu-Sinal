<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f6fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1d2b" media="(prefers-color-scheme: dark)" />
  <!-- Permite instalar o protótipo na tela inicial do celular -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icones/icone-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icones/icone-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EduSinal" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>EduSinal | Aprender Libras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Bootstrap e Bootstrap Icons ficam dentro do projeto: funcionam sem internet -->
  <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <!-- O nosso CSS vem depois, para as cores e o visual do EduSinal valerem.
       A ORDEM IMPORTA: quando duas regras brigam, ganha a do arquivo que vem
       depois. base.css (cores e peças comuns) sempre primeiro. -->
  <link rel="stylesheet" href="css/base.css?v=123" />
  <link rel="stylesheet" href="css/home.css?v=123" />
  <link rel="stylesheet" href="css/atividade.css?v=123" />
  <link rel="stylesheet" href="css/abas.css?v=123" />
  <link rel="stylesheet" href="css/mascote.css?v=123" />
  <link rel="stylesheet" href="css/celular.css?v=123" />
  <link rel="stylesheet" href="css/bootstrap.css?v=123" />
  <link rel="stylesheet" href="css/arvore.css?v=123" />
  <link rel="stylesheet" href="css/configuracoes.css?v=123" />
  <link rel="stylesheet" href="css/perfil.css?v=123" />
  <link rel="stylesheet" href="css/boas-vindas.css?v=123" />
  <link rel="stylesheet" href="css/cadastro.css?v=123" />
</head>
<body>
  <a class="skip-link" href="#screen-root">Pular para o conteúdo</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#trilha" data-screen="trail" aria-label="EduSinal, trilha">
        <img src="../../assets/images/Mascote%20Libras%20em%20Azul%20vibrante.png" alt="" />
        <span>Edu<span class="brand-accent">Sinal</span></span>
      </a>
      <p class="sidebar-label" id="sidebar-label">ESPAÇO DO ALUNO</p>
      <nav class="side-nav" id="side-nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><i class="bi bi-stars sidebar-note-mark" aria-hidden="true"></i><span>Um sinal por dia já faz diferença.</span></div>
      </div>
    </aside>

    <div class="workspace">
      <h1 class="screen-title-sr" id="screen-heading">Minha trilha</h1>
      <!-- Barra de cima, só no celular: ofensiva, moedas (abre a lojinha), vidas e configurações -->
      <header class="mobile-topbar">
        <button class="mobile-avatar" id="mobile-avatar" type="button" data-screen="profile" aria-label="Seu perfil"></button>
        <button class="mobile-brand" type="button" data-screen="trail" aria-label="EduSinal, ir para a Home"><span>Edu<span class="brand-accent">Sinal</span></span></button>
        <div class="mobile-stats" id="mobile-stats"></div>
        <button class="settings-button" id="settings-button" type="button" data-screen="more" aria-label="Configurações"><i class="bi bi-gear-fill" aria-hidden="true"></i></button>
      </header>
      <main class="screen-root" id="screen-root" tabindex="-1"></main>
      <footer class="app-footer"><span>EduSinal <span class="footer-dot">•</span> Ambiente demonstrativo</span><a href="../../landing/index.html?v=2">Página inicial <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a></footer>
    </div>

    <!-- Barra de baixo, só no celular: as abas principais -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Abas principais"></nav>
  </div>

  <!-- Avisos rápidos (Toast do Bootstrap) -->
  <div class="toast-container app-toast-area">
    <div class="toast app-toast" id="toast" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="3200">
      <div class="d-flex align-items-center">
        <div class="toast-body" id="toast-text"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar aviso"></button>
      </div>
    </div>
  </div>

  <!-- Janela de confirmação (Modal do Bootstrap), usada antes de apagar progresso -->
  <div class="modal fade" id="streak-modal" tabindex="-1" aria-labelledby="streak-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content streak-modal-content">
        <button type="button" class="btn-close btn-close-white streak-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        <div id="streak-body"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="confirm-title">Tem certeza?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="confirm-text"></div>
        <div class="modal-footer">
          <button type="button" class="button button-outline" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="button button-danger" id="confirm-ok">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Janela de compra da Lojinha: o mascote com o item em cima, o texto e os botões lado a lado.
       O Comprar começa travado por 3 s (barrinha enchendo); Cancelar funciona na hora. -->
  <div class="modal fade" id="buy-modal" tabindex="-1" aria-labelledby="buy-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content buy-modal-content">
        <span class="buy-modal-art" id="buy-art"></span>
        <h2 class="buy-modal-title" id="buy-title"></h2>
        <p class="buy-modal-text" id="buy-text"></p>
        <div class="buy-modal-actions">
          <button type="button" class="button-3d button-3d-outline" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="button-3d button-3d-gold buy-confirm" id="buy-ok"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script src="js/estado.js?v=123" defer></script>
  <script src="js/mascote-desenho.js?v=123" defer></script>
  <script src="js/conteudo.js?v=123" defer></script>
  <script src="js/telas-trilha.js?v=123" defer></script>
  <script src="js/licao.js?v=123" defer></script>
  <script src="js/telas-dicionario.js?v=123" defer></script>
  <script src="js/telas-ligas.js?v=123" defer></script>
  <script src="js/telas-missoes.js?v=123" defer></script>
  <script src="js/telas-lojinha.js?v=123" defer></script>
  <script src="js/telas-perfil.js?v=123" defer></script>
  <script src="js/telas-mascote.js?v=123" defer></script>
  <script src="js/telas-conta.js?v=123" defer></script>
  <script src="js/calendario.js?v=123" defer></script>
  <script src="js/app.js?v=123" defer></script>
</body>
</html>
